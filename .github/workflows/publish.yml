name: Publish

# 推送 v* tag 触发:跑完整质量门禁后发布到 npm 公共仓库,并创建 GitHub Release。
# 约定:tag 名(去掉 v 前缀)必须与 cli/package.json 的 version 一致,workflow 会强制校验。
# 发布走 npm Trusted Publishing (OIDC),无需 token;前提是 npmjs.com 已为本包配置
# trusted publisher(workflow publish.yml + environment npm-publish,见根 README「CI / 发布」)。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 GitHub Release
  id-token: write # npm Trusted Publishing (OIDC) 认证与 provenance

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION 与 cli/package.json version $PKG_VERSION 不一致"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # 预发布版本(含 -)打 next dist-tag,不占 latest;正式版行为不变。
      - name: Publish to npm
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          DIST_TAG=latest
          case "$PKG_VERSION" in *-*) DIST_TAG=next ;; esac
          npm publish --access public --provenance --tag "$DIST_TAG"

      - name: Create GitHub Release
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          case "$PKG_VERSION" in
            *-*) gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --prerelease ;;
            *)   gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --latest ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}
