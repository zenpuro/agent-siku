name: Publish

# 推送 v* tag 触发:跑完整质量门禁后发布到 npm 公共仓库,并创建 GitHub Release。
# 约定:tag 名(去掉 v 前缀)必须与 cli/package.json 的 version 一致,workflow 会强制校验。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 GitHub Release
  id-token: write # npm publish --provenance 的 OIDC 证明

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION 与 cli/package.json version $PKG_VERSION 不一致"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --latest
        env:
          GH_TOKEN: ${{ github.token }}
